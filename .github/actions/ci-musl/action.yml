name: musl build or test phase
description: Run one exact experimental musl architecture/backend CI phase.

inputs:
  phase:
    description: build or test
    required: true
  arch:
    description: Node and artifact architecture name
    required: true
  backend:
    description: stub or aws
    required: true
  image:
    description: Pinned Alpine container image
    required: true
  node-version:
    description: Node version selector used by the test phase
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: cache OpenSSL floor
      if: inputs.phase == 'build'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .ossl/${{ env.AWSKMS_OPENSSL_FLOOR }}
        key: openssl-musl-${{ inputs.arch }}-${{ env.AWSKMS_OPENSSL_FLOOR }}

    - name: cache compiled AWS dependencies
      if: inputs.phase == 'build' && inputs.backend == 'aws'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: build/.ccache
        key: ccache-v1-alpine3.22.5-${{ inputs.arch }}-ossl${{ env.AWSKMS_OPENSSL_FLOOR }}-${{ github.sha }}
        restore-keys: |
          ccache-v1-alpine3.22.5-${{ inputs.arch }}-ossl${{ env.AWSKMS_OPENSSL_FLOOR }}-

    - name: cache AWS SDK source
      if: inputs.phase == 'build' && inputs.backend == 'aws'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: build/_deps/aws-sdk-cpp
        key: aws-sdk-cpp-src-${{ runner.os }}-${{ hashFiles('cmake/FetchAwsSdkKms.cmake', 'scripts/patch-s2n-empty-kdf.sh', 'scripts/patch-s2n-openssl4.sh', 'scripts/patch-aws-sdk-keyspec.sh') }}

    - name: build in pinned Alpine 3.22.5
      if: inputs.phase == 'build'
      shell: bash
      run: |
        docker run --rm -v "$PWD:/src" -w /src \
          -e AWSKMS_HOST_UID="$(id -u)" -e AWSKMS_HOST_GID="$(id -g)" \
          '${{ inputs.image }}' ./scripts/ci-alpine.sh build \
            '${{ inputs.backend }}' '${{ inputs.arch }}' \
            '${{ env.AWSKMS_OPENSSL_FLOOR }}'

    - name: upload experimental archive dry-run
      if: inputs.phase == 'build' && inputs.backend == 'aws'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: awskms-linuxmusl-${{ inputs.arch }}
        path: awskms-*-linuxmusl-${{ inputs.arch }}.tar.gz
        if-no-files-found: error

    - name: upload module for tests
      if: inputs.phase == 'build'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: module-musl-${{ inputs.arch }}-${{ inputs.backend }}
        retention-days: 1
        path: |
          build/aws-kms.so
          build/awskms.cnf
          build/awskms.relocatable.cnf
          build/awskms-backend
          build/awskms-dependencies
          build/awskms-stub-mldsa
          build/awskms_provider_unload
        if-no-files-found: error

    - name: download module for tests
      if: inputs.phase == 'test'
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: module-musl-${{ inputs.arch }}-${{ inputs.backend }}
        path: build

    - name: capability probe and tests in pinned Alpine 3.22.5
      if: inputs.phase == 'test'
      shell: bash
      run: |
        docker run --rm -v "$PWD:/src" -w /src \
          -e AWSKMS_HOST_UID="$(id -u)" -e AWSKMS_HOST_GID="$(id -g)" \
          '${{ inputs.image }}' ./scripts/ci-alpine.sh test \
            '${{ inputs.backend }}' '${{ inputs.arch }}' \
            '${{ inputs.node-version }}'
