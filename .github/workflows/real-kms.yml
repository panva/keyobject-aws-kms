# The only workflow that spends money.
#
# It provisions real AWS KMS keys, runs the suite against them, and schedules the
# keys for deletion. Keys are created fresh every run and deletion is never
# cancelled, so key ARNs differ every run and the aliases are the stable handle.
#
# A pull request CAN reach this workflow, but only behind two gates that must both
# hold. This was not always so -- the trigger was previously absent entirely -- so
# the reasoning is worth stating in full:
#
#   1. The PR must come from THIS repository, not a fork. A fork PR receives no
#      OIDC token at all on a `pull_request` event, so it cannot assume any role
#      regardless of what the `if:` says; the explicit check below makes that
#      refusal immediate and legible rather than a confusing STS error.
#   2. The PR must carry the `real-kms` label. Only someone with write access can
#      apply a label, so the label IS the permission gate.
#
# AWS cannot help with gate 2. A `pull_request` event's OIDC subject is
# `repo:ORG/REPO:pull_request` with no branch and no label in it, so the trust
# policy either allows the whole event type or none of it. That makes the label
# the only thing standing between a PR job and a role that can create and delete
# KMS keys, and a job running PR-authored code can mint its own OIDC token --
# id-token:write is enough. Do not remove the label condition thinking the trust
# policy still constrains this; it does not.
#
# `types:` includes `labeled` so applying the label starts a run, and
# `synchronize` so pushing to an already-labelled PR re-runs it.
#
# It deliberately does NOT run on push to main. The question this workflow
# answers -- "does the provider still work against the actual service?" -- needs
# answering periodically and on demand, not once per commit. The daily cron
# covers periodic and the labelled PR covers on demand, so a per-push run would
# add cost without adding signal. Everything that IS worth checking per commit is
# free and lives in ci.yml.
name: real-kms

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    # Daily smoke pass. Note GitHub disables scheduled workflows in repositories
    # with no activity, so the 7-day deletion window is the real backstop, not this.
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      full_matrix:
        description: all 22 keys instead of the 8-key smoke subset
        required: true
        type: boolean
        default: false

# One group shared with the reaper workflow, so the two cannot race. github.workflow
# is deliberately omitted from the group, because the exclusion wanted here is
# cross-workflow rather than per-workflow.
#
# `queue: max` is load-bearing. The default `queue: single` cancels and replaces
# any existing pending run in the group, so a third run silently drops the second.
# That is harmless for a pending run, which never got as far as creating keys, but
# it makes the queue lossy. cancel-in-progress stays false regardless: cancelling a
# running run is what abandons provisioned keys.
concurrency:
  group: awskms-real-kms
  queue: max

# Nothing by default; each job opts in to exactly what it needs.
permissions: {}

# Actions are pinned to full commit SHAs rather than tags. A tag is mutable by
# whoever controls the action repository, and these jobs hold credentials able to
# create and delete KMS keys, which makes a silently changed action a live
# compromise path. The trailing comment names the release the SHA belongs to;
# .github/dependabot.yml keeps the two in step. Resolving one by hand:
#
#   gh api repos/<owner>/<repo>/releases/latest --jq .tag_name
#   gh api repos/<owner>/<repo>/git/ref/tags/<tag> --jq .object.sha

jobs:
  real-kms:
    name: real AWS KMS (spends money)
    # Both gates, and both only apply to pull_request events: same repository (not
    # a fork), and the `real-kms` label. See the header for why the label cannot be
    # enforced on the AWS side.
    if: >-
      github.event_name != 'pull_request' || (
        github.event.pull_request.head.repo.full_name == github.repository &&
        contains(github.event.pull_request.labels.*.name, 'real-kms')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write # to request the OIDC JWT
      contents: read # for actions/checkout
    env:
      AWS_REGION: ${{ vars.AWSKMS_TEST_REGION }}
      # Full matrix only on an explicit manual request.
      SUBSET: ${{ (github.event_name == 'workflow_dispatch' && inputs.full_matrix) && '' || '--smoke' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pinned to the floor rather than the runner's default. This is load-bearing
      # in a way that is easy to miss: the aws-backend fix below removes the exit-2
      # refusal that used to stop this job, and the next thing in line is
      # test/run.mjs's capability probe, which prints an explanation and exits 0 on
      # a node that cannot pass a URL to createPrivateKey. Without this pin the fix
      # would convert a loud failure into a silent, billable no-op.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      # Mandatory for the aws backend, not defensive:
      # S2N_ENFORCE_PROPER_LIBCRYPTO_FEATURE_PROBE=ON makes a libcrypto that cannot
      # be linked at configure time a fatal error rather than a silently degraded s2n.
      - name: Install the build prerequisites
        run: sudo apt-get update && sudo apt-get install -y libssl-dev

      # -DAWSKMS_BACKEND=aws is required. The default is `stub`, which contains no
      # AWS client at all, and test/run.mjs refuses AWSKMS_TEST_REAL=1 against it
      # with exit 2. This job could never have worked without it.
      - name: Build the provider
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DAWSKMS_BACKEND=aws
          cmake --build build --parallel

      # Before spending money. A module that leaks libcrypto or fails to load is
      # worth catching ahead of key creation, not after.
      - name: Verify the module loads
        run: scripts/check-load.sh build "$(command -v node)"

      - name: Assume the provisioner role
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWSKMS_ADMIN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create the keys
        run: node scripts/real-kms-keys.mjs setup $SUBSET

      # The signer role is assumed by chaining inside this step, which keeps the
      # admin credentials in the job environment for the teardown step. Teardown
      # does not depend on re-running configure-aws-credentials, because a
      # cancelled run gets only a few minutes and an action step may not start.
      #
      # Running the suite under a least-privilege principal is what makes the
      # "only kms:Sign and kms:GetPublicKey are needed" claim testable, rather
      # than merely true of a run whose credentials happened to be powerful.
      - name: Run the suite as the signer
        timeout-minutes: 20
        env:
          SIGNER_ROLE_ARN: ${{ vars.AWSKMS_SIGNER_ROLE_ARN }}
        run: |
          set -euo pipefail
          creds=$(aws sts assume-role \
            --role-arn "$SIGNER_ROLE_ARN" \
            --role-session-name "awskms-${GITHUB_RUN_ID}" \
            --duration-seconds 3600 \
            --query Credentials --output json)
          export AWS_ACCESS_KEY_ID=$(jq -r .AccessKeyId <<<"$creds")
          export AWS_SECRET_ACCESS_KEY=$(jq -r .SecretAccessKey <<<"$creds")
          export AWS_SESSION_TOKEN=$(jq -r .SessionToken <<<"$creds")
          unset AWS_PROFILE
          AWSKMS_TEST_REAL=1 node test/run.mjs

      # always(), not !cancelled():
      #
      #   always()        runs on success, failure and cancellation
      #   !cancelled()    runs on success and failure but not on cancellation
      #
      # A cancelled run is precisely when keys are left behind, so !cancelled()
      # would skip teardown in the case that matters most. always() steps can hang
      # until the workflow times out, hence the explicit timeout; a cancelled run
      # gets about five minutes before jobs are forcibly terminated, ample for 22
      # DescribeKey + ScheduleKeyDeletion pairs.
      #
      # This is a step in the same job rather than a `needs:` job because only
      # steps of an already-running job are documented to be re-evaluated after a
      # cancellation.
      - name: Schedule the keys for deletion
        if: always()
        timeout-minutes: 5
        run: node scripts/real-kms-keys.mjs teardown --window 7 --sweep $SUBSET

      # Surfaces leaks immediately rather than on next month's bill. Runs even if
      # teardown failed, and never fails the job itself.
      - name: Report anything still billable
        if: always()
        continue-on-error: true
        run: node scripts/real-kms-keys.mjs status $SUBSET
