# Builds and tests the provider. Until this existed, nothing did.
#
# The job that matters most is check-load: a provider that fails to load produces
# NO diagnostic -- node starts fine and fails at the first createPrivateKey -- so
# a build that merely compiles proves very little. check-load asserts the module
# exports exactly one symbol, links no libcrypto, loads in the openssl CLI, and
# that every OpenSSL symbol it needs is exported by the OLDEST node claimed to be
# supported. That last check is the only defence against a symbol-skew failure,
# which is all-or-nothing at dlopen and which node hides entirely.
#
# Both operating systems are built because this provider's bugs have been
# asymmetric. libcrypto leaked into the Linux artifact for months while macOS was
# clean, because aws-c-cal reaches for libcrypto only on non-Apple platforms and
# the "links no libcrypto" property had been measured on macOS and written down as
# universal. Linux needs ~223 OpenSSL symbols to macOS's ~68, so neither platform
# is a proxy for the other.
#
# The aws backend is not built on every PR: it fetches ~206 MB of aws-sdk-cpp.
# It runs on the schedule, on demand, and on tags, which is also what keeps its
# cache warm -- GitHub evicts entries not accessed in 7 days, and nothing else
# here touches it.
#
# A `v*` tag runs exactly the same build and then publishes. Packaging is NOT
# tag-only: the archives are built, unpacked and verified on every schedule and
# dispatch, so the only thing a tag exercises for the first time is the publish
# itself. A release path first executed while cutting a release is how this
# repository has been bitten before.
name: ci

on:
  push:
    branches: [main]
    # A `v*` tag additionally publishes; see the `release` job. Everything up to
    # that point is the same build the schedule runs, so a tag exercises nothing
    # that has not already been exercised.
    tags: ['v*']
  pull_request:
    # `labeled` is what arms the real-kms job below. The other three are the
    # defaults, which are lost the moment `types:` is written out at all.
    types: [opened, synchronize, reopened, labeled]
  schedule:
    # Every 5 days rather than weekly, so the aws-sdk-cpp cache entry is refreshed
    # inside GitHub's 7-day eviction window rather than exactly on it.
    - cron: '17 5 */5 * *'
    # A SECOND cadence, kept distinct from the one above by github.event.schedule.
    # The former real-kms.yml ran daily; folding it in must not silently stretch
    # that to five days. This one arms ONLY the real-kms job -- it must not drag
    # the ~206 MB aws-backend matrix along daily, which is why the backend
    # expressions below test for the 5-day cron specifically rather than for
    # `event_name == 'schedule'`.
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      # Off by default, and deliberately so. Dispatching ci.yml by hand is an
      # ordinary thing to do -- to warm the aws-sdk-cpp cache, or to run the aws
      # backend before cutting a release -- and none of that should quietly cost
      # money. Spending is opt-in on every route: a label on a PR, this box, or
      # the daily cron.
      real_kms:
        description: also run against REAL AWS KMS (spends ~$0.13)
        required: true
        type: boolean
        default: false
      full_matrix:
        description: real KMS - all 22 keys instead of the 8-key smoke subset
        required: true
        type: boolean
        default: false

# Deliberately no `paths:` filter. If this ever becomes a required status check, a
# run skipped by a path filter never reports at all and blocks the merge.
permissions:
  contents: read

# The OLDEST OpenSSL the published artifacts are compiled against. Not a
# preference: see B4 in TODO.txt and the long note on the build job. One value,
# read by the build job and passed into the musl container, so the floor cannot
# differ between targets.
env:
  AWSKMS_OPENSSL_FLOOR: '3.0.21'

# A real-kms run is placed in its OWN group and never cancelled. This is not
# tidiness: cancelling a run that has already created KMS keys abandons them
# billing, which is the exact failure `queue: max` exists to prevent in the
# reaper. Left in the ordinary PR group, the next push to the branch would
# cancel it mid-flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ (github.event.action == 'labeled' && github.event.label.name == 'real-kms') && '-real-kms' || '' }}
  # Superseded PR runs are cancelled; runs on main and the schedule are not,
  # because those are the runs that populate the caches every PR reads, and a
  # cancelled job does not save its cache. This is unlike real-kms.yml, whose
  # `queue: max` exists so a cancelled run cannot abandon provisioned KMS keys --
  # nothing here touches anything outside the runner.
  cancel-in-progress: ${{ github.event_name == 'pull_request' && !(github.event.action == 'labeled' && github.event.label.name == 'real-kms') }}

# Actions are pinned to full commit SHAs rather than tags; .github/dependabot.yml
# rewrites the SHA and its trailing version comment together. See the longer note
# in real-kms.yml for why a mutable tag is a live compromise path there.

jobs:
  node-versions:
    uses: panva/.github/.github/workflows/node-versions.yml@main
    with:
      min: 26

  build:
    name: build ${{ matrix.platform.os }} / ${{ matrix.backend }}
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 30
    strategy:
      # The whole point of building both platforms is that they differ. Stopping
      # the matrix on the first failure would hide exactly the asymmetry this is
      # here to catch.
      fail-fast: false
      matrix:
        # An OBJECT-VALUED KEY, deliberately, rather than `include:`. This bit
        # once and cost five of six legs: an include entry whose keys are all
        # absent from the base matrix does not create a new combination, it is
        # MERGED INTO the existing ones. `node-version` and `backend` each
        # resolve to a single value on a push, so there was exactly ONE
        # combination -- and all six platform entries merged into it, each
        # overwriting the last. The matrix expanded to a single job carrying the
        # LAST entry's values, four platforms never ran, and nothing anywhere
        # reported a problem. A real key cross-multiplies, which is the intent.
        #
        # There is deliberately NO node axis here. Compiling does not depend on
        # the node version at all -- measured: no node headers, libs, binary or
        # node-gyp anywhere in the build, src/napi.c hand-declares the two N-API
        # entry points with void*, and a logging `node` shim placed first on PATH
        # across a fresh configure plus a full build recorded ZERO invocations.
        # Building once per node version produced N identical binaries.
        #
        # It also made the release artifact WRONG in waiting: the artifact name
        # is platform+arch with no node component, so the moment node-versions
        # returns two entries (when Node 27 ships, 2027-04-22) two legs would
        # upload the same name and upload-artifact would 409. The node matrix
        # belongs on `test`, against ONE artifact -- which is also the stronger
        # property: the bytes we publish are the bytes exercised on every
        # supported node, rather than one build per node of which one is shipped.
        #
        # musl is not here either: it needs a different libc, a different node
        # source and a different runner arrangement -- see the build-musl job.
        platform:
          - os: ubuntu-latest
          - os: ubuntu-24.04-arm
          - os: macos-latest
          - os: macos-15-intel
        # The aws backend costs a ~206 MB SDK fetch, so it is reserved for the
        # schedule, for manual runs, and for tags. workflow_dispatch means the
        # expensive legs are reachable on demand -- before a release, when
        # touching cmake/, or simply to refresh the cache. A TAG needs them
        # because they are what produce the artifacts the release job publishes.
        backend: ${{ (github.event.schedule == '17 5 */5 * *' || github.event.schedule == '17 4 * * *' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || (github.event.action == 'labeled' && github.event.label.name == 'real-kms')) && fromJSON('["stub","aws"]') || fromJSON('["stub"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installed first so its path can be captured before the matrix node
      # replaces it on PATH. check-load.sh is documented to take the OLDEST
      # supported node first, and the matrix resolves to `current`, which is not
      # the floor -- the undefined-symbol audit is only as good as the oldest host
      # it runs against.
      #
      # The floor is read from .node-version rather than written here, because
      # real-kms.yml needs the SAME value and the two must move together: bump one
      # and forget the other, and the money workflow silently stops testing the
      # oldest supported host while still looking correct. One file, two readers.
      # It also gives nvm/fnm the right version locally for free.
      #
      # That version is where the OSSL_STORE loader shipped, so it is the floor by
      # definition -- there is no released node this provider runs on before it.
      # ONE node, and only because staging asks it for platform+arch and the
      # unpacked-archive check runs the doctor. Nothing compiled here depends on
      # it. The floor is read from .node-version rather than written here because
      # the test job needs the SAME value and the two must move together.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      # libssl-dev is not optional for either backend: awskms_unit is only built
      # when find_package(OpenSSL) locates libraries, and the aws backend fails at
      # CONFIGURE time without a linkable libcrypto, because
      # S2N_ENFORCE_PROPER_LIBCRYPTO_FEATURE_PROBE=ON turns an unlinkable one into
      # a fatal error rather than a silently degraded s2n.
      - name: install the linux prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev

      # B4: the artifact is compiled against the OLDEST supported OpenSSL, not
      # against whatever the runner happens to ship. Every OpenSSL call in this
      # module stays an UNDEFINED symbol and binds at dlopen to the host, so the
      # required symbol set is a function of the build machine's HEADERS -- and
      # vendored s2n calls EVP_MD_CTX_size, a macro that expands to
      # EVP_MD_CTX_get_size_ex from OpenSSL 3.4 and to a pair of 3.0-era calls
      # before it. Built on a 3.4+ runner the artifact could not dlopen on a 3.0
      # host AT ALL, and nothing said so: no compiler warning (the macro is
      # working as designed), no linker error (we deliberately link nothing), and
      # the header matrix passes because each build is correct for ITS header.
      # Compile old, run new -- measured to load on 3.0, 3.6 and 4.0.
      - name: cache the floor openssl
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/awskms-openssl/${{ env.AWSKMS_OPENSSL_FLOOR }}
          key: openssl-${{ runner.os }}-${{ runner.arch }}-${{ env.AWSKMS_OPENSSL_FLOOR }}

      # Called unconditionally rather than behind a cache-hit flag: the script is
      # idempotent and returns at once on a complete prefix, so a PARTIAL restore
      # repairs itself here instead of failing later at configure.
      - name: build the floor openssl
        run: scripts/build-openssl.sh "$AWSKMS_OPENSSL_FLOOR"

      # The source tree only, never _deps/aws-sdk-cpp-build: object files are
      # larger than the source and a stale object tree across compiler versions is
      # a worse failure than a rebuild. No restore-keys: the fetch short-circuits
      # on a .awskms-fetched-<tag> marker, so a partial-key restore would look
      # fetched, carry the marker, and silently skip a re-fetch it needed.
      - name: cache the aws sdk source
        if: matrix.backend == 'aws'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/_deps/aws-sdk-cpp
          key: aws-sdk-cpp-src-${{ runner.os }}-${{ hashFiles('cmake/FetchAwsSdkKms.cmake') }}

      # The aws legs carry the release flags, so what gets packaged below is what
      # was just tested rather than a separate build nobody exercised.
      #   deployment target  otherwise the dylib records the BUILD HOST's OS as
      #                      its minimum, making the support floor an accident of
      #                      the runner image
      #   static libstdc++   so the artifact does not additionally require the
      #                      builder's GCC runtime. Costs ~0.7 MB.
      - name: configure
        run: |
          set -euo pipefail
          extra=()
          if [ '${{ matrix.backend }}' = aws ]; then
            if [ '${{ runner.os }}' = macOS ]; then
              extra+=(-DCMAKE_OSX_DEPLOYMENT_TARGET=13.5)
            else
              extra+=(-DCMAKE_MODULE_LINKER_FLAGS="-static-libstdc++ -static-libgcc")
            fi
          fi
          # ${extra[@]+"${extra[@]}"} rather than "${extra[@]}": macOS runners run
          # /bin/bash 3.2, where expanding an EMPTY array under `set -u` is an
          # "unbound variable" error. Linux has bash 5 and does not care, so this
          # fails on exactly one leg of the matrix.
          # CMAKE_PREFIX_PATH as well as OPENSSL_ROOT_DIR, and the second one is
          # the load-bearing one for the aws backend. OPENSSL_ROOT_DIR steers
          # OUR find_package(OpenSSL); s2n inside the AWS SDK uses its own
          # cmake/modules/Findcrypto.cmake, which hints only on CMAKE_PREFIX_PATH
          # and CMAKE_INSTALL_PREFIX and has never heard of OPENSSL_ROOT_DIR.
          # Without this, s2n compiled against whatever headers the machine had
          # -- homebrew 3.6 on macOS, openssl-dev 3.5.7 on Alpine -- and
          # re-emitted the 3.4+ expansion of the EVP_MD_CTX_size macro, so the
          # SHIPPING artifact required EVP_MD_CTX_get_size_ex and failed the
          # floor check on 4 of 6 targets. ubuntu passed only because its system
          # OpenSSL happens to be 3.0.x.
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DOPENSSL_ROOT_DIR="$HOME/.cache/awskms-openssl/$AWSKMS_OPENSSL_FLOOR" \
            -DCMAKE_PREFIX_PATH="$HOME/.cache/awskms-openssl/$AWSKMS_OPENSSL_FLOOR" \
            -DAWSKMS_BACKEND=${{ matrix.backend }} ${extra[@]+"${extra[@]}"}

      - name: build
        run: cmake --build build --parallel

      # -R '^unit$' because the aws backend brings the AWS SDK in via
      # add_subdirectory, and the subproject registers its own ~230 add_test()
      # entries -- whose executables are never built, since it is added
      # EXCLUDE_FROM_ALL. Unfiltered, ctest reports 231 tests, passes ours, then
      # fails on "Unable to find executable: aws-crt-cpp-tests". The stub backend
      # never adds the SDK, so this is invisible there.
      #
      # --no-tests=error so that a rename of our test does not turn this step into
      # a silent no-op that runs nothing and reports success.
      - name: unit tests
        run: ctest --test-dir build -R '^unit$' --no-tests=error --output-on-failure

      # The assertion that closes B4. Its real content is not "we compiled
      # against 3.0" but "the build actually USED those headers rather than
      # whatever the runner had" -- which is the mistake that produced B4. Pure
      # symbol arithmetic against a libcrypto already on disk: no node, no
      # runtime host, milliseconds.
      #
      # Proven to catch the real thing: the shipped aws artifact built on a 3.6
      # runner fails this with EVP_MD_CTX_get_size_ex, and the stub with
      # EVP_PKEY_sign_message_init.
      - name: the module stays within the openssl floor
        run: |
          set -euo pipefail
          mod=build/awskms.dylib; [ -f "$mod" ] || mod=build/awskms.so
          scripts/check-symbol-floor.sh "$mod" \
            "$HOME/.cache/awskms-openssl/$AWSKMS_OPENSSL_FLOOR"

      # Packaging runs here, on the aws legs, rather than only in some future
      # release workflow. A release path that fires only on a tag is first
      # exercised while you are cutting a release, which is the worst moment to
      # discover it does not work -- this repository has already been bitten by
      # exactly that (real-kms.yml had never once run). Nothing is published; the
      # tarball is a workflow artifact so the staging, the deployment target, the
      # static libstdc++ and the relocatable cnf are all continuously exercised.
      - name: stage the archive
        if: matrix.backend == 'aws'
        id: stage
        run: |
          set -euo pipefail
          # Ask node what platform this is, rather than mapping runner labels.
          # `${process.platform}-${process.arch}` is EXACTLY the key the npm core
          # package looks the satellite up by, so the artifact name and the
          # lookup cannot drift -- and there is no table to forget to update.
          #
          # The label-mapping version had `macos-*) target=darwin-arm64`, which
          # would have quietly labelled the Intel leg's x86_64 bytes as arm64.
          target=$(node -p "process.platform + '-' + process.arch")
          # This job is glibc-only; musl is built by build-musl, which names its
          # artifacts linuxmusl-<arch>. node reports plain "linux" under EITHER
          # libc, so a musl leg reappearing here would silently produce a
          # colliding linux-<arch> name carrying musl bytes -- installable, and
          # then broken at dlopen for everyone who got it.
          node -e 'if (process.platform === "linux" && !process.report.getReport().header.glibcVersionRuntime) {
                     console.error("::error::musl host in the glibc build job; the artifact would be misnamed");
                     process.exit(1) }'
          dir="awskms-${target}"
          mkdir -p "stage/$dir"
          cp build/awskms.dylib "stage/$dir/" 2>/dev/null || cp build/awskms.so "stage/$dir/"
          # The RELOCATABLE cnf, not build/awskms.cnf: that one bakes an absolute
          # path into the build tree and would be wrong the moment it is unpacked
          # anywhere else. This one resolves $ENV::AWSKMS_MODULE at load, and an
          # UNSET variable is a loud fatal rather than a silent no-load.
          cp build/awskms.relocatable.cnf "stage/$dir/awskms.cnf"
          cp scripts/awskms-doctor.mjs LICENSE "stage/$dir/"
          tar czf "$dir.tar.gz" -C stage "$dir"
          echo "target=$target" >> "$GITHUB_OUTPUT"
          ls -la "$dir.tar.gz"

      # Unpack it somewhere else entirely and prove it still works, which is the
      # whole claim a relocatable archive makes.
      - name: the unpacked archive works
        if: matrix.backend == 'aws'
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/unpack"
          mkdir -p "$d" && tar xzf "awskms-${{ steps.stage.outputs.target }}.tar.gz" -C "$d"
          p="$d/awskms-${{ steps.stage.outputs.target }}"
          mod="$p/awskms.dylib"; [ -f "$mod" ] || mod="$p/awskms.so"
          AWSKMS_MODULE="$mod" node --openssl-config="$p/awskms.cnf" "$p/awskms-doctor.mjs"

      - name: upload the archive
        if: matrix.backend == 'aws'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: awskms-${{ steps.stage.outputs.target }}
          path: awskms-${{ steps.stage.outputs.target }}.tar.gz
          if-no-files-found: error

      # What `test` consumes. Only the outputs it actually reads -- measured as
      # exactly five files across check-load.sh, the doctor, test/run.mjs and
      # npm-pack.sh; none of them touches CMakeCache, the objects or awskms_unit.
      # Named by RUNNER LABEL rather than platform+arch so the test job can
      # reconstruct the name from its own matrix without asking node and without
      # a mapping table to drift.
      - name: upload the module for testing
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: module-${{ matrix.platform.os }}-${{ matrix.backend }}
          # Intra-run plumbing, consumed by `test` minutes later and useless
          # after. The 90-day default kept 12 of these per dispatch run -- more
          # artifacts than the 6 that are actually deliverables, and enough noise
          # to bury them in the UI. 1 is the minimum GitHub accepts.
          retention-days: 1
          path: |
            build/awskms.dylib
            build/awskms.so
            build/awskms.cnf
            build/awskms.relocatable.cnf
            build/awskms-backend
            build/awskms-stub-mldsa
          if-no-files-found: error

  # Everything that depends on the NODE version, run against ONE artifact per
  # platform rather than one build per node. That ordering is the point: the
  # bytes published are the exact bytes exercised on every supported node.
  test:
    needs: [node-versions, build]
    name: test ${{ matrix.platform.os }} / node ${{ matrix.node-version }} / ${{ matrix.backend }}
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Must stay in step with `build`'s platform list -- the artifact name is
        # built from matrix.platform.os on both sides.
        platform:
          - os: ubuntu-latest
          - os: ubuntu-24.04-arm
          - os: macos-latest
          - os: macos-15-intel
        node-version: ${{ fromJSON(needs.node-versions.outputs.matrix) }}
        backend: ${{ (github.event.schedule == '17 5 */5 * *' || github.event.schedule == '17 4 * * *' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || (github.event.action == 'labeled' && github.event.label.name == 'real-kms')) && fromJSON('["stub","aws"]') || fromJSON('["stub"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The floor first, so its path is captured before the matrix node replaces
      # it on PATH. check-load.sh takes the OLDEST supported node first: the
      # undefined-symbol audit is only as good as the oldest host it runs
      # against, and the matrix resolves to `current`, which is not the floor.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: record the floor node
        run: echo "AWSKMS_FLOOR_NODE=$(command -v node)" >> "$GITHUB_ENV"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}

      # /usr/bin/openssl on macOS is LibreSSL, which has no `list -providers`, so
      # check-load.sh's CLI probe and the HTTP KMS stub both need a real one
      # ahead of it on PATH. `brew --prefix` is asked rather than hardcoded
      # because it differs by architecture.
      - name: point at a real openssl
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          prefix="$(brew --prefix openssl@3)"
          echo "AWSKMS_OPENSSL=$prefix/bin/openssl" >> "$GITHUB_ENV"
          echo "$prefix/bin" >> "$GITHUB_PATH"

      - name: download the module
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: module-${{ matrix.platform.os }}-${{ matrix.backend }}
          path: build

      - name: check-load
        run: scripts/check-load.sh build "$AWSKMS_FLOOR_NODE" "$(command -v node)"

      # The RELOCATABLE cnf plus AWSKMS_MODULE, never build/awskms.cnf: that one
      # baked in the absolute path of the machine that COMPILED it, which is a
      # different job now. It would happen to work while both runners use the
      # same workspace path, and fail silently the day one of them does not.
      - name: the provider is reachable
        run: |
          set -euo pipefail
          mod="$PWD/build/awskms.dylib"; [ -f "$mod" ] || mod="$PWD/build/awskms.so"
          AWSKMS_MODULE="$mod" node --openssl-config="$PWD/build/awskms.relocatable.cnf" \
            scripts/awskms-doctor.mjs

      # run.mjs prints an explanation and exits 0 when the node cannot pass a URL
      # to createPrivateKey. Right for a developer, wrong here: the node version
      # comes from a resolving matrix, so a green no-op could appear at any time
      # without anyone changing this file.
      - name: end-to-end suites
        run: |
          set -euo pipefail
          node test/run.mjs 2>&1 | tee /tmp/suite.log
          if grep -q 'Skipping the end-to-end suites' /tmp/suite.log; then
            echo "::error::the suites silently skipped -- $(node -p process.version) lacks the OSSL_STORE loader (needs >= $(cat .node-version))"
            exit 1
          fi
          grep -qE '^. pass [1-9]' /tmp/suite.log || {
            echo "::error::the suites reported no passing tests"
            exit 1
          }

      # The npm packages, built and USED -- packed, installed from the tarballs
      # into a throwaway project, then driven through modulePath(),
      # opensslConfigPath(), register(), the bin and the doctor. No registry is
      # involved. This lives HERE rather than in `build` because everything it
      # exercises -- require.resolve, exports subpaths, process.dlopen -- is
      # node-dependent, which is exactly what this job varies.
      - name: npm packages
        run: scripts/npm-pack.sh build

  # musl. A different C library, not a different version of one -- a glibc-linked
  # module does not run on Alpine at all -- so these are genuinely separate
  # artifacts rather than a rebuild of the linux-* ones.
  #
  # A separate JOB rather than two more legs of `build` because almost nothing is
  # shared: setup-node cannot serve it (nodejs.org/dist publishes no musl builds),
  # there is no apt, and the work has to happen inside a container the GitHub
  # runner is unable to host actions in on arm64. Folding that into `build` meant
  # an `if:` on nearly every step. The long version is in scripts/ci-alpine.sh.
  build-musl:
    name: build & test alpine ${{ matrix.platform.arch }} / ${{ matrix.backend }}
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Object-valued for the same reason as `build` above -- an `include:`
        # entry adding only new keys is merged into the existing combinations
        # instead of multiplying them, and collapses this to one job.
        platform:
          - os: ubuntu-latest
            arch: x64
          - os: ubuntu-24.04-arm
            arch: arm64
        backend: ${{ (github.event.schedule == '17 5 */5 * *' || github.event.schedule == '17 4 * * *' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || (github.event.action == 'labeled' && github.event.label.name == 'real-kms')) && fromJSON('["stub","aws"]') || fromJSON('["stub"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Deliberately the SAME key as the glibc legs, so this shares their cache
      # rather than fetching its own copy. The cached path is the SDK's source
      # tree only, which is identical across libc and architecture; nothing
      # compiled goes in it.
      - name: cache the aws sdk source
        if: matrix.backend == 'aws'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/_deps/aws-sdk-cpp
          key: aws-sdk-cpp-src-${{ runner.os }}-${{ hashFiles('cmake/FetchAwsSdkKms.cmake') }}

      # The container builds the floor OpenSSL into the bind-mounted workspace
      # so it survives the container, which is otherwise ephemeral.
      - name: cache the floor openssl (musl)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ossl/${{ env.AWSKMS_OPENSSL_FLOOR }}
          key: openssl-musl-${{ matrix.platform.arch }}-${{ env.AWSKMS_OPENSSL_FLOOR }}

      # The runner is glibc and stays that way: checkout, cache and
      # upload-artifact all run out here, where the runner's own node works. Only
      # the build and the tests go inside, which is the only part that needs musl.
      # No QEMU -- ubuntu-24.04-arm is a real arm64 host, so the arm64 image runs
      # natively.
      #
      # The alpine tag is a plain version pin. Dependabot cannot see it (there is
      # no Dockerfile and no docker ecosystem entry for a bare `docker run`), so
      # it is bumped by hand.
      - name: build in alpine
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/src" -w /src \
            -e AWSKMS_HOST_UID="$(id -u)" -e AWSKMS_HOST_GID="$(id -g)" \
            alpine:3.24 \
            ./scripts/ci-alpine.sh build '${{ matrix.backend }}' \
              '${{ matrix.platform.arch }}' '${{ env.AWSKMS_OPENSSL_FLOOR }}'

      - name: upload the archive
        if: matrix.backend == 'aws'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: awskms-linuxmusl-${{ matrix.platform.arch }}
          path: awskms-linuxmusl-${{ matrix.platform.arch }}.tar.gz
          if-no-files-found: error

      - name: upload the module for testing
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: module-musl-${{ matrix.platform.arch }}-${{ matrix.backend }}
          retention-days: 1   # intra-run only; see the note in `build`
          path: |
            build/awskms.so
            build/awskms.cnf
            build/awskms.relocatable.cnf
            build/awskms-backend
            build/awskms-stub-mldsa
          if-no-files-found: error

  # The musl half of `test`. A separate job for the same reason build-musl is:
  # GitHub cannot run JavaScript actions in an Alpine container on arm64, so
  # checkout, download-artifact and the caches have to stay on a glibc host while
  # only the test run itself goes inside. Without this job musl was the one
  # target that never saw the node matrix at all -- it was built and tested by a
  # single floor-pinned node, while every other target was exercised across
  # every supported version.
  test-musl:
    needs: [node-versions, build-musl]
    name: test alpine ${{ matrix.platform.arch }} / node ${{ matrix.node-version }} / ${{ matrix.backend }}
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Must stay in step with build-musl -- the artifact name is built from
        # matrix.platform.arch on both sides.
        platform:
          - os: ubuntu-latest
            arch: x64
          - os: ubuntu-24.04-arm
            arch: arm64
        node-version: ${{ fromJSON(needs.node-versions.outputs.matrix) }}
        backend: ${{ (github.event.schedule == '17 5 */5 * *' || github.event.schedule == '17 4 * * *' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || (github.event.action == 'labeled' && github.event.label.name == 'real-kms')) && fromJSON('["stub","aws"]') || fromJSON('["stub"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: download the module
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: module-musl-${{ matrix.platform.arch }}-${{ matrix.backend }}
          path: build

      # The node-version here is a setup-node SPEC ("current", "lts/<codename>"),
      # not a version number, and setup-node cannot serve musl anyway. The spec is
      # resolved inside the container against the unofficial-builds index -- see
      # the long note in ci-alpine.sh for why it must be resolved against THAT
      # index and not nodejs.org/dist.
      - name: test in alpine
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/src" -w /src \
            -e AWSKMS_HOST_UID="$(id -u)" -e AWSKMS_HOST_GID="$(id -g)" \
            alpine:3.24 \
            ./scripts/ci-alpine.sh test '${{ matrix.backend }}' \
              '${{ matrix.platform.arch }}' '${{ matrix.node-version }}'

  # Real AWS KMS. Folded in from the former real-kms.yml, which is deleted --
  # a separate workflow meant the money path had its own triggers, its own node
  # pin and its own copy of the build, and it had never once run.
  #
  # ARMED BY A LABEL, AND ONLY BY THE LABELING EVENT ITSELF. The gate is
  # `github.event.action == 'labeled'`, not "the label is present in the array".
  # That makes it a genuine one-shot: a later `synchronize` cannot re-fire it,
  # so nothing here depends on real-kms-label.yml winning a race to remove the
  # label. Removal exists to make the label re-usable as a button -- you cannot
  # add a label that is already there -- not to keep the run from repeating.
  #
  # Same-repo is required as well. The trigger is `pull_request`, NEVER
  # `pull_request_target`, so a fork PR is not exposed to OIDC or secrets at all
  # regardless of any `if:`; the explicit check is the second barrier. Applying a
  # label needs write access, so the label IS the permission gate.
  #
  # It rebuilds rather than consuming the `build` artifact deliberately: making
  # it `needs: build` would drag the whole 4-platform x 2-backend matrix -- three
  # of those a 206 MB SDK fetch -- onto every press of the button, to spend money
  # once on one platform.
  real-kms:
    name: real AWS KMS (spends money)
    # ALLOW-LIST, not a deny-list. The obvious inversion --
    # `github.event_name != 'pull_request' || (...)` -- is true for PUSH, and
    # ci.yml runs on every push to main and on tags where the old real-kms.yml
    # deliberately did not. That phrasing would spend money on every commit that
    # lands. Enumerate the events that may spend instead.
    if: >-
      github.event.schedule == '17 4 * * *' ||
      (github.event_name == 'workflow_dispatch' && inputs.real_kms) || (
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.action == 'labeled' &&
        github.event.label.name == 'real-kms'
      )
    # Consumes the ubuntu-latest aws artifact, so it must wait for it. Every
    # event that can arm this job also puts `aws` in the backend matrix -- see
    # the backend expression on `build` -- so the artifact is always there.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The SAME group as real-kms-reaper.yml, so the reaper can never sweep keys a
    # live run still needs. github.workflow is deliberately absent: the exclusion
    # wanted here is cross-workflow. Job-level concurrency takes only `group` and
    # `cancel-in-progress`, so the old `queue: max` cannot be expressed here --
    # the consequence is a lossy PENDING queue, never a cancelled RUNNING one,
    # and only a running job can abandon keys.
    concurrency:
      group: awskms-real-kms
      cancel-in-progress: false
    permissions:
      id-token: write # to request the OIDC JWT
      contents: read  # for actions/checkout
    env:
      AWS_REGION: ${{ vars.AWSKMS_TEST_REGION }}
      SUBSET: ${{ (github.event_name == 'workflow_dispatch' && inputs.full_matrix) && '' || '--smoke' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pinned to the floor rather than the runner's default, and load-bearing in
      # a way that is easy to miss: with the backend fixed, the next thing in line
      # is test/run.mjs's capability probe, which prints an explanation and exits
      # 0 on a node that cannot pass a URL to createPrivateKey. Unpinned, this
      # would be a silent, billable no-op.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      # THE ARTIFACT THAT SHIPS, downloaded rather than rebuilt. This job used
      # to compile its own copy, which meant the bytes we publish had never once
      # touched the real service -- and B4 and B5 both proved that build
      # provenance is exactly where this project's defects live: identical
      # source, different bytes, depending on what the build host happened to
      # have installed. Testing a look-alike build against real KMS answers a
      # question nobody asked.
      #
      # It also deletes ~200 lines of work from the money path: no libssl-dev, no
      # OpenSSL floor build, no 206 MB SDK fetch, no compile. The job now starts
      # spending within a minute instead of ten.
      - name: download the module that ships
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: module-ubuntu-latest-aws
          path: build

      # Before spending money. A module that fails to load is worth catching
      # ahead of key creation, not after.
      #
      # No check-symbol-floor here: the job that BUILT this artifact already
      # asserted it against the floor, and re-asserting would need an OpenSSL 3.0
      # prefix built solely to repeat a passed check.
      - name: verify the module loads
        run: scripts/check-load.sh build "$(command -v node)"

      - name: assume the provisioner role
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWSKMS_ADMIN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: create the keys
        run: node scripts/real-kms-keys.mjs setup $SUBSET

      # The signer role is chained INSIDE this step, keeping the admin credentials
      # in the job environment for teardown -- a cancelled run gets only a few
      # minutes and an action step may not start at all.
      #
      # Running the suite under a least-privilege principal is what makes the
      # "only kms:Sign and kms:GetPublicKey are needed" claim testable, rather
      # than merely true of a run whose credentials happened to be powerful.
      - name: run the suite as the signer
        timeout-minutes: 20
        env:
          SIGNER_ROLE_ARN: ${{ vars.AWSKMS_SIGNER_ROLE_ARN }}
        run: |
          set -euo pipefail
          creds=$(aws sts assume-role \
            --role-arn "$SIGNER_ROLE_ARN" \
            --role-session-name "awskms-${GITHUB_RUN_ID}" \
            --duration-seconds 3600 \
            --query Credentials --output json)
          AWS_ACCESS_KEY_ID=$(jq -r .AccessKeyId <<<"$creds"); export AWS_ACCESS_KEY_ID
          AWS_SECRET_ACCESS_KEY=$(jq -r .SecretAccessKey <<<"$creds"); export AWS_SECRET_ACCESS_KEY
          AWS_SESSION_TOKEN=$(jq -r .SessionToken <<<"$creds"); export AWS_SESSION_TOKEN
          unset AWS_PROFILE
          AWSKMS_TEST_REAL=1 node test/run.mjs

      # always(), not !cancelled():
      #
      #   always()      runs on success, failure AND cancellation
      #   !cancelled()  runs on success and failure but not on cancellation
      #
      # A cancelled run is precisely when keys are left behind, so !cancelled()
      # would skip teardown in the case that matters most. A cancelled run gets
      # about five minutes before jobs are forcibly terminated, ample for 22
      # DescribeKey + ScheduleKeyDeletion pairs.
      # NO --sweep. This tears down only the keys THIS RUN created; the daily
      # reaper does the tag sweep for orphans (`reap`, same 7-day window).
      #
      # The reason is the cancellation path, which is the one that matters. A
      # cancelled run gets roughly five minutes before jobs are forcibly
      # terminated, and the sweep is unbounded work -- it walks every key
      # carrying the test tag and issues a DescribeKey/ScheduleKeyDeletion pair
      # for each. Measured on run 31077332081: 8 manifest keys against 87 swept,
      # so the sweep was over 90% of the work and none of it was this run's.
      # Spending the scarce cancellation budget on other runs' orphans is exactly
      # backwards -- it risks leaving OUR keys behind to clean up someone else's.
      #
      # Nothing is lost: an orphan the reaper would have caught, it still catches,
      # within a day and with no time pressure at all.
      - name: schedule the keys for deletion
        if: always()
        timeout-minutes: 5
        run: node scripts/real-kms-keys.mjs teardown --window 7 $SUBSET

      # Surfaces leaks immediately rather than on next month's bill. Runs even if
      # teardown failed, and never fails the job itself.
      - name: report anything still billable
        if: always()
        continue-on-error: true
        run: node scripts/real-kms-keys.mjs status $SUBSET

  openssl-headers:
    name: openssl ${{ matrix.version }} headers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The declared floor, the ML-DSA floor, and the next major. 3.6 is omitted
        # deliberately: it sits between two covered versions and adds no API
        # surface the other three do not already bracket.
        version: ['3.0.21', '3.5.7', '4.0.1']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: cache the openssl prefix
        id: ossl
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/awskms-openssl/${{ matrix.version }}
          key: openssl-${{ runner.os }}-${{ runner.arch }}-${{ matrix.version }}

      # Called unconditionally: build-openssl.sh returns at once on a complete
      # prefix, so a partial cache restore repairs itself rather than failing
      # later. Same script the build job uses for the floor, so the two cannot
      # drift -- they had already diverged into two copies once.
      - name: build openssl ${{ matrix.version }}
        run: scripts/build-openssl.sh '${{ matrix.version }}'

      # An explicit include dir is required: with no arguments the script probes
      # homebrew then nix and exits 2 on a stock runner, and its nix path wants a
      # nodejs checkout for tools/nix/openssl-matrix.nix.
      - name: build against those headers
        run: scripts/check-openssl-matrix.sh "$HOME/.cache/awskms-openssl/${{ matrix.version }}/include"

  # THE RUNTIME LANE. openssl-headers above answers "does it COMPILE against
  # 3.0/3.5/4.0 headers"; this answers the question that actually shipped a bug:
  # does the artifact we BUILD -- compiled once against the floor -- still LOAD
  # against each of those OpenSSL versions?
  #
  # B4 lived exactly in that gap. Every header tree built clean, because each
  # build was correct for its own header; the defect only existed when the axes
  # were crossed. Crossing them is this job.
  #
  # No node is built or needed. libcrypto is the loader, not node: OpenSSL's DSO
  # layer dlopens the module with RTLD_NOW, so every undefined symbol must
  # resolve there or the load fails outright. The `openssl` CLI of a given
  # version is therefore a faithful host for the entire question, and
  # build-openssl.sh already installs one per version via install_sw. Building
  # node --shared-openssl per version would answer the same question at roughly
  # 112 minutes a leg, because nodejs.org binaries static-link OpenSSL.
  openssl-runtime:
    needs: build
    name: openssl ${{ matrix.version }} runtime / ${{ matrix.backend }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        version: ['3.0.21', '3.5.7', '4.0.1']
        backend: ${{ (github.event.schedule == '17 5 */5 * *' || github.event.schedule == '17 4 * * *' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || (github.event.action == 'labeled' && github.event.label.name == 'real-kms')) && fromJSON('["stub","aws"]') || fromJSON('["stub"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Linux rather than a platform matrix on purpose: the module needs ~223
      # OpenSSL symbols here against macOS's ~68, so this is the stricter host
      # for a symbol question. A macOS artifact still gets its floor asserted in
      # the build job.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: cache the openssl prefix
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/awskms-openssl/${{ matrix.version }}
          key: openssl-${{ runner.os }}-${{ runner.arch }}-${{ matrix.version }}

      - name: build openssl ${{ matrix.version }}
        run: scripts/build-openssl.sh '${{ matrix.version }}'

      # The artifact as built -- compiled once against the floor -- not a rebuild
      # against this version's headers. Testing a rebuild would re-answer the
      # compile question and miss the point entirely.
      - name: download the module
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: module-ubuntu-latest-${{ matrix.backend }}
          path: build

      - name: does it load against openssl ${{ matrix.version }}
        run: |
          set -euo pipefail
          prefix="$HOME/.cache/awskms-openssl/${{ matrix.version }}"
          # Static first: name the missing symbols rather than only reporting
          # that dlopen failed. On a failure this is the message that explains it.
          scripts/check-symbol-floor.sh build/awskms.so "$prefix"
          # Then actually load it. This CLI is the version under test, put ahead
          # of the runner's own openssl on PATH; check-load.sh's probe resolves
          # `openssl` from PATH and asserts the provider reports itself active.
          export PATH="$prefix/bin:$PATH"
          # The CLI has to find its OWN libcrypto/libssl. Without this, 4.0 dies
          # outright ("libssl.so.4: cannot open shared object file") and -- far
          # worse -- 3.0 and 3.5 SILENTLY LOAD THE SYSTEM libcrypto.so.3, whose
          # SONAME matches, so the leg passes while testing the runner's OpenSSL
          # rather than the one under test.
          export LD_LIBRARY_PATH="$prefix/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export DYLD_LIBRARY_PATH="$prefix/lib${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}"
          # ASSERT the version rather than printing it. That silent fallback is
          # exactly the failure this job exists to catch, so a runtime lane that
          # cannot prove which runtime it used is worth nothing.
          # The LIBRARY version, not the binary's. When the CLI loads a
          # different libcrypto than it was built from, `openssl version` prints
          # e.g. "OpenSSL 3.0.21 ... (Library: OpenSSL 3.0.13 ...)" -- and the
          # binary version alone would happily assert 3.0.21 while the whole
          # check ran against the runner's 3.0.13. Measured: that is exactly
          # what this leg did before LD_LIBRARY_PATH was set.
          out=$(openssl version)
          lib=$(printf '%s' "$out" | sed -n 's/.*(Library: OpenSSL \([0-9][0-9.]*\).*/\1/p')
          got=${lib:-$(printf '%s' "$out" | awk '{print $2}')}
          echo "openssl: $out"
          [ "$got" = '${{ matrix.version }}' ] || {
            echo "::error::the libcrypto in use is $got, not ${{ matrix.version }} -- this leg would have graded the wrong OpenSSL"
            exit 1
          }
          scripts/check-load.sh build "$(command -v node)"

  # The musl half of openssl-runtime. Needed for the same reason test-musl is:
  # the musl module is a DIFFERENT binary from a different toolchain, and its
  # required symbol set genuinely differs -- measured 225 against glibc's 226 on
  # the aws backend -- so the glibc lane proves nothing about this artifact.
  # Separate job for the usual container reason: no JavaScript actions in an
  # Alpine container on arm64.
  openssl-runtime-musl:
    needs: build-musl
    name: openssl ${{ matrix.version }} runtime musl / ${{ matrix.backend }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        version: ['3.0.21', '3.5.7', '4.0.1']
        backend: ${{ (github.event.schedule == '17 5 */5 * *' || github.event.schedule == '17 4 * * *' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || (github.event.action == 'labeled' && github.event.label.name == 'real-kms')) && fromJSON('["stub","aws"]') || fromJSON('["stub"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # x64 only, matching the glibc lane. This asks a symbol question, and the
      # arm64 musl artifact's floor is already asserted by its own build phase;
      # a second architecture would triple the OpenSSL builds for little more.
      - name: download the module
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: module-musl-x64-${{ matrix.backend }}
          path: build

      - name: cache the openssl prefix (musl)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ossl/${{ matrix.version }}
          key: openssl-musl-x64-${{ matrix.version }}

      - name: load it against openssl ${{ matrix.version }}
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/src" -w /src \
            -e AWSKMS_HOST_UID="$(id -u)" -e AWSKMS_HOST_GID="$(id -g)" \
            alpine:3.24 \
            ./scripts/ci-alpine.sh ossl '${{ matrix.backend }}' x64 '${{ matrix.version }}'

  lint:
    name: format & shell
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pinned exactly. clang-format's output changes between majors, and the
      # runner image ships 18 while .clang-format was calibrated against 22 --
      # an unpinned binary would fail on correctly formatted code. Dependabot
      # does not track this pin; bump it by hand and re-run clang-format -i.
      # A venv rather than pipx or a bare pip: ubuntu blocks pip outside a venv
      # (PEP 668), and this form needs nothing beyond python3, so it does not
      # depend on what the runner image happens to preinstall.
      - name: clang-format
        run: |
          set -euo pipefail
          python3 -m venv /tmp/cf
          /tmp/cf/bin/pip install -q clang-format==22.1.8
          /tmp/cf/bin/clang-format --version
          /tmp/cf/bin/clang-format --dry-run --Werror \
            src/*.c src/*.h src/*.cc test/unit_*.c test/unit.h

      # Preinstalled on GitHub's ubuntu images. SC2001 is excluded: the scripts
      # use sed for indentation in a way the suggested parameter expansion does
      # not express as readably.
      - name: shellcheck
        run: shellcheck -e SC2001 scripts/*.sh

  # Publishing. Everything it ships was built, tested, packaged, unpacked and
  # verified by the `build` job above -- this job only collects, checksums,
  # attests and publishes. It is the ONLY part of the pipeline that a tag
  # exercises for the first time, which is why the rest deliberately runs on
  # every schedule and dispatch rather than waiting for one.
  release:
    name: publish the release
    # EVERY job that can say the artifact is wrong, not merely the ones that
    # produce it. openssl-runtime was missing here, which meant a tag could have
    # published a module that fails to dlopen on OpenSSL 3.0 or 4.0 -- B4 and B5
    # exactly, the two defects that took a day to find. The guard existing but
    # not gating is worse than not having it: it produces a green tick beside a
    # broken release.
    #
    # real-kms is deliberately NOT here, and not by oversight. It is skipped on a
    # tag push (the allow-list admits only the daily cron, dispatch and a
    # label), and a skipped `needs` skips the dependent -- listing it would block
    # every release outright.
    needs:
      - build
      - build-musl
      - test
      - test-musl
      - openssl-runtime
      - openssl-runtime-musl
      - openssl-headers
      - lint
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write      # create the release
      id-token: write      # OIDC, for the provenance attestation
      attestations: write
    steps:
      # `pattern` is not optional now that `build` also publishes module-*
      # artifacts for the test job: without it merge-multiple would flatten
      # several platforms' awskms.so on top of one another in dist/.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: awskms-*
          path: dist
          merge-multiple: true

      # A tag that produced no artifacts would otherwise publish an empty
      # release, which is worse than failing.
      - name: checksums
        run: |
          set -euo pipefail
          cd dist
          ls -la
          count=$(ls -1 awskms-*.tar.gz 2>/dev/null | wc -l | tr -d ' ')
          [ "$count" -gt 0 ] || { echo "::error::no artifacts to release"; exit 1; }
          sha256sum awskms-*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      # subject-checksums attests one subject per line, so every asset is
      # individually verifiable and the SHA256SUMS that is published is the same
      # file that drove the attestation.
      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-checksums: dist/SHA256SUMS

      # Plain `gh` rather than a third-party release action: one fewer party in
      # the trust path of the job that signs the artifacts. --verify-tag so a
      # mistyped ref cannot create a release against a tag that does not exist.
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            --title "$GITHUB_REF_NAME" \
            dist/awskms-*.tar.gz dist/SHA256SUMS
