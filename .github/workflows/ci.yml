name: build and test

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, ready_for_review]
  schedule:
    # Weekly full CI also exercises the real AWS KMS integration suite.
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      real_kms:
        description: run against real AWS KMS
        required: true
        type: boolean
        default: false
      full_matrix:
        description: use all real-KMS keys instead of the smoke subset
        required: true
        type: boolean
        default: false

permissions:
  contents: read

env:
  AWSKMS_OPENSSL_FLOOR: '3.0.21'
  AWSKMS_MACOS_FLOOR: '13.5'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ (github.event.action == 'labeled' && github.event.label.name == 'real-kms') && '-real-kms' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && !(github.event.action == 'labeled' && github.event.label.name == 'real-kms') }}

jobs:
  gate:
    name: not a draft
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo 'CI is enabled for this event'

  node-versions:
    name: resolve Node versions from 26 onward
    needs: gate
    uses: panva/.github/.github/workflows/node-versions.yml@e1fa8c4be19de2cf97b4a8ac99de8fd8d6bee3bd
    with:
      min: 26

  build-glibc:
    name: build glibc 2.28 / ${{ matrix.platform.arch }} / ${{ matrix.backend }}
    needs: gate
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: ubuntu-latest
            arch: x64
            image: almalinux@sha256:f043b7ac550015e1ed0b5a55a420c61d178bff4357ab9663fe0fbdcf1e6e2d86
          - os: ubuntu-24.04-arm
            arch: arm64
            image: almalinux@sha256:058da2bf381d460db9121940fbd035190ffbf28caec923cb9ba06c6e990da274
        backend: [stub, aws]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: cache OpenSSL floor
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ossl-glibc/${{ env.AWSKMS_OPENSSL_FLOOR }}
          key: openssl-alma8-${{ matrix.platform.arch }}-${{ env.AWSKMS_OPENSSL_FLOOR }}

      - name: cache AWS SDK source
        if: matrix.backend == 'aws'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/_deps/aws-sdk-cpp
          key: aws-sdk-cpp-src-${{ runner.os }}-${{ hashFiles('cmake/FetchAwsSdkKms.cmake', 'scripts/patch-s2n-empty-kdf.sh', 'scripts/patch-s2n-openssl4.sh', 'scripts/patch-aws-sdk-keyspec.sh') }}

      - name: build and verify in pinned AlmaLinux 8
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/src" -w /src \
            -e AWSKMS_HOST_UID="$(id -u)" -e AWSKMS_HOST_GID="$(id -g)" \
            '${{ matrix.platform.image }}' \
            ./scripts/ci-alma.sh build '${{ matrix.backend }}' \
              '${{ matrix.platform.arch }}' '${{ env.AWSKMS_OPENSSL_FLOOR }}'

      - name: upload archive dry-run
        if: matrix.backend == 'aws'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: awskms-linux-${{ matrix.platform.arch }}
          path: awskms-*-linux-${{ matrix.platform.arch }}.tar.gz
          if-no-files-found: error

      - name: upload module for tests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: module-glibc-${{ matrix.platform.arch }}-${{ matrix.backend }}
          retention-days: 1
          path: |
            build/aws-kms.so
            build/awskms.cnf
            build/awskms.relocatable.cnf
            build/awskms-backend
            build/awskms-dependencies
            build/awskms-stub-mldsa
            build/awskms_provider_unload
          if-no-files-found: error

  build-macos:
    name: build macOS / ${{ matrix.platform.arch }} / ${{ matrix.backend }}
    needs: gate
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: macos-latest
            arch: arm64
            binary_arch: arm64
          - os: macos-15-intel
            arch: x64
            binary_arch: x86_64
        backend: [stub, aws]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: cache OpenSSL floor
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/awskms-openssl/${{ env.AWSKMS_OPENSSL_FLOOR }}
          key: openssl-${{ runner.os }}-${{ runner.arch }}-${{ env.AWSKMS_OPENSSL_FLOOR }}

      - name: build OpenSSL floor
        run: scripts/build-openssl.sh "$AWSKMS_OPENSSL_FLOOR"

      - name: cache AWS SDK source
        if: matrix.backend == 'aws'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/_deps/aws-sdk-cpp
          key: aws-sdk-cpp-src-${{ runner.os }}-${{ hashFiles('cmake/FetchAwsSdkKms.cmake', 'scripts/patch-s2n-empty-kdf.sh', 'scripts/patch-s2n-openssl4.sh', 'scripts/patch-aws-sdk-keyspec.sh') }}

      - name: configure, build, and verify
        run: |
          set -euo pipefail
          prefix="$HOME/.cache/awskms-openssl/$AWSKMS_OPENSSL_FLOOR"
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DAWSKMS_BACKEND='${{ matrix.backend }}' \
            -DOPENSSL_ROOT_DIR="$prefix" -DCMAKE_PREFIX_PATH="$prefix" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$AWSKMS_MACOS_FLOOR"
          cmake --build build --parallel
          ctest --test-dir build -R '^unit$' --no-tests=error --output-on-failure
          scripts/check-symbol-floor.sh build/aws-kms.dylib "$prefix"
          scripts/check-binary-compat.sh macos build/aws-kms.dylib \
            '${{ matrix.platform.binary_arch }}' "$AWSKMS_MACOS_FLOOR"
          scripts/ci-policy-gate.sh artifact build/aws-kms.dylib

      - name: stage and exercise archive dry-run
        if: matrix.backend == 'aws'
        id: archive
        run: |
          set -euo pipefail
          target="darwin-${{ matrix.platform.arch }}"
          version=$(node -p "require('./npm/core/package.json').version")
          directory="awskms-$version-$target"
          archive="$directory.tar.gz"
          scripts/package-archive.sh build "$target" .
          scripts/ci-policy-gate.sh artifact build/aws-kms.dylib "$archive"
          unpack="$RUNNER_TEMP/unpack"
          mkdir -p "$unpack"
          tar xzf "$archive" -C "$unpack"
          AWSKMS_MODULE="$unpack/$directory/aws-kms.dylib" \
            node --openssl-config="$unpack/$directory/awskms.cnf" \
            "$unpack/$directory/check.mjs"
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: upload archive dry-run
        if: matrix.backend == 'aws'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: awskms-${{ steps.archive.outputs.target }}
          path: ${{ steps.archive.outputs.archive }}
          if-no-files-found: error

      - name: upload module for tests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: module-macos-${{ matrix.platform.arch }}-${{ matrix.backend }}
          retention-days: 1
          path: |
            build/aws-kms.dylib
            build/awskms.cnf
            build/awskms.relocatable.cnf
            build/awskms-backend
            build/awskms-dependencies
            build/awskms-stub-mldsa
            build/awskms_provider_unload
          if-no-files-found: error

  test-glibc:
    name: test glibc / ${{ matrix.platform.arch }} / Node ${{ matrix.node-version }} / ${{ matrix.backend }}
    needs: [node-versions, build-glibc]
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: ubuntu-latest
            arch: x64
            image: almalinux@sha256:f043b7ac550015e1ed0b5a55a420c61d178bff4357ab9663fe0fbdcf1e6e2d86
          - os: ubuntu-24.04-arm
            arch: arm64
            image: almalinux@sha256:058da2bf381d460db9121940fbd035190ffbf28caec923cb9ba06c6e990da274
        node-version: ${{ fromJSON(needs.node-versions.outputs.matrix) }}
        backend: [stub, aws]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ossl-glibc/${{ env.AWSKMS_OPENSSL_FLOOR }}
          key: openssl-alma8-${{ matrix.platform.arch }}-${{ env.AWSKMS_OPENSSL_FLOOR }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: module-glibc-${{ matrix.platform.arch }}-${{ matrix.backend }}
          path: build
      - name: capability probe and tests in pinned AlmaLinux 8
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/src" -w /src \
            -e AWSKMS_HOST_UID="$(id -u)" -e AWSKMS_HOST_GID="$(id -g)" \
            '${{ matrix.platform.image }}' \
            ./scripts/ci-alma.sh test '${{ matrix.backend }}' \
              '${{ matrix.platform.arch }}' '${{ matrix.node-version }}' \
              '${{ env.AWSKMS_OPENSSL_FLOOR }}'

  test-macos:
    name: test macOS / ${{ matrix.platform.arch }} / Node ${{ matrix.node-version }} / ${{ matrix.backend }}
    needs: [node-versions, build-macos]
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: macos-latest
            arch: arm64
          - os: macos-15-intel
            arch: x64
        node-version: ${{ fromJSON(needs.node-versions.outputs.matrix) }}
        backend: [stub, aws]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/awskms-openssl/${{ env.AWSKMS_OPENSSL_FLOOR }}
          key: openssl-${{ runner.os }}-${{ runner.arch }}-${{ env.AWSKMS_OPENSSL_FLOOR }}
      - name: restore the OpenSSL floor used by the unload harness
        run: scripts/build-openssl.sh "$AWSKMS_OPENSSL_FLOOR"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: record mandatory-capable Node
        run: echo "AWSKMS_FLOOR_NODE=$(command -v node)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: select OpenSSL CLI
        run: |
          prefix="$(brew --prefix openssl@3)"
          echo "AWSKMS_OPENSSL=$prefix/bin/openssl" >> "$GITHUB_ENV"
          echo "$prefix/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: module-macos-${{ matrix.platform.arch }}-${{ matrix.backend }}
          path: build
      - name: restore the internal unload harness mode
        run: |
          test -s build/awskms_provider_unload
          chmod 755 build/awskms_provider_unload
          test -x build/awskms_provider_unload
      - name: load and probe capability
        run: |
          set -euo pipefail
          scripts/check-load.sh build "$AWSKMS_FLOOR_NODE" "$(command -v node)"
          set +e
          node -e 'const {createPrivateKey}=require("node:crypto");try{createPrivateKey({key:new URL("aws-kms:")});process.exit(0)}catch(e){process.exit(e.code==="ERR_INVALID_ARG_TYPE"?2:0)}'
          rc=$?
          set -e
          if [ "$rc" -eq 2 ]; then
            echo "Node $(node -p 'process.version') must support URL-backed OpenSSL STORE keys" >&2
            exit 1
          fi
      - name: full provider and package suites
        run: |
          set -euo pipefail
          module="$PWD/build/aws-kms.dylib"
          AWSKMS_MODULE="$module" node \
            --openssl-config="$PWD/build/awskms.relocatable.cnf" scripts/check.mjs
          AWSKMS_UNLOAD_HARNESS="$PWD/build/awskms_provider_unload" \
            node test/run.mjs 2>&1 | tee /tmp/suite.log
          ! grep -q 'Skipping the end-to-end suites' /tmp/suite.log
          grep -qE ' pass [1-9][0-9]*$' /tmp/suite.log
          grep -F '✔ explicit provider unload leaves the host process usable' /tmp/suite.log
          if [ '${{ matrix.backend }}' = aws ]; then scripts/npm-pack.sh build; fi

  required-capable:
    name: mandatory capable Node lane
    needs: build-glibc
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ossl-glibc/${{ env.AWSKMS_OPENSSL_FLOOR }}
          key: openssl-alma8-x64-${{ env.AWSKMS_OPENSSL_FLOOR }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: module-glibc-x64-stub
          path: build
      - name: require the declared floor Node to run every suite
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            -e AWSKMS_HOST_UID="$(id -u)" -e AWSKMS_HOST_GID="$(id -g)" \
            'almalinux@sha256:f043b7ac550015e1ed0b5a55a420c61d178bff4357ab9663fe0fbdcf1e6e2d86' \
            ./scripts/ci-alma.sh test stub x64 "$(cat .node-version)" \
              "$AWSKMS_OPENSSL_FLOOR"

  sanitizers:
    name: ASan and UBSan / mandatory-capable Node
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ossl-glibc/${{ env.AWSKMS_OPENSSL_FLOOR }}
          key: openssl-alma8-x64-${{ env.AWSKMS_OPENSSL_FLOOR }}
      - name: run the unit and provider suites under ASan and UBSan
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            -e AWSKMS_HOST_UID="$(id -u)" -e AWSKMS_HOST_GID="$(id -g)" \
            'almalinux@sha256:f043b7ac550015e1ed0b5a55a420c61d178bff4357ab9663fe0fbdcf1e6e2d86' \
            ./scripts/ci-alma.sh sanitize stub x64 "$(cat .node-version)" \
              "$AWSKMS_OPENSSL_FLOOR"

  build-musl-experimental:
    name: experimental musl build / ${{ matrix.platform.arch }} / ${{ matrix.backend }}
    needs: gate
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: ubuntu-latest
            arch: x64
            image: alpine@sha256:7c8cb692ae09657cbc4a3f3cbd0e8d5a2690ba38386aaaf252dbb060bf5eb2e6
          - os: ubuntu-24.04-arm
            arch: arm64
            image: alpine@sha256:2c9d26f410d032d5b1525aa8a873e238b05b90c4ae8618743d4311f0cc827e37
        backend: [stub, aws]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ossl/${{ env.AWSKMS_OPENSSL_FLOOR }}
          key: openssl-musl-${{ matrix.platform.arch }}-${{ env.AWSKMS_OPENSSL_FLOOR }}
      - name: build in pinned Alpine 3.22.5
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            -e AWSKMS_HOST_UID="$(id -u)" -e AWSKMS_HOST_GID="$(id -g)" \
            '${{ matrix.platform.image }}' ./scripts/ci-alpine.sh build \
              '${{ matrix.backend }}' '${{ matrix.platform.arch }}' \
              '${{ env.AWSKMS_OPENSSL_FLOOR }}'
      - name: upload experimental archive dry-run
        if: matrix.backend == 'aws'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: awskms-linuxmusl-${{ matrix.platform.arch }}
          path: awskms-*-linuxmusl-${{ matrix.platform.arch }}.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: module-musl-${{ matrix.platform.arch }}-${{ matrix.backend }}
          retention-days: 1
          path: |
            build/aws-kms.so
            build/awskms.cnf
            build/awskms.relocatable.cnf
            build/awskms-backend
            build/awskms-dependencies
            build/awskms-stub-mldsa
            build/awskms_provider_unload
          if-no-files-found: error

  test-musl-experimental:
    name: experimental musl test / ${{ matrix.platform.arch }} / Node ${{ matrix.node-version }} / ${{ matrix.backend }}
    needs: [node-versions, build-musl-experimental]
    if: always() && needs.node-versions.result == 'success' && needs.build-musl-experimental.result == 'success'
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: ubuntu-latest
            arch: x64
            image: alpine@sha256:7c8cb692ae09657cbc4a3f3cbd0e8d5a2690ba38386aaaf252dbb060bf5eb2e6
          - os: ubuntu-24.04-arm
            arch: arm64
            image: alpine@sha256:2c9d26f410d032d5b1525aa8a873e238b05b90c4ae8618743d4311f0cc827e37
        node-version: ${{ fromJSON(needs.node-versions.outputs.matrix) }}
        backend: [stub, aws]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: module-musl-${{ matrix.platform.arch }}-${{ matrix.backend }}
          path: build
      - name: capability probe and tests in pinned Alpine 3.22.5
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            -e AWSKMS_HOST_UID="$(id -u)" -e AWSKMS_HOST_GID="$(id -g)" \
            '${{ matrix.platform.image }}' ./scripts/ci-alpine.sh test \
              '${{ matrix.backend }}' '${{ matrix.platform.arch }}' \
              '${{ matrix.node-version }}'

  openssl-headers:
    name: OpenSSL ${{ matrix.version }} headers
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        version: ['3.0.21', '3.5.7', '4.0.1']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/awskms-openssl/${{ matrix.version }}
          key: openssl-${{ runner.os }}-${{ runner.arch }}-${{ matrix.version }}
      - run: scripts/build-openssl.sh '${{ matrix.version }}'
      - run: scripts/check-openssl-matrix.sh "$HOME/.cache/awskms-openssl/${{ matrix.version }}/include"

  openssl-runtime:
    name: OpenSSL ${{ matrix.version }} load and register / ${{ matrix.backend }}
    needs: build-glibc
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        version: ['3.0.21', '3.5.7', '4.0.1']
        backend: [stub, aws]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/awskms-openssl/${{ matrix.version }}
          key: openssl-${{ runner.os }}-${{ runner.arch }}-${{ matrix.version }}
      - run: scripts/build-openssl.sh '${{ matrix.version }}'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: module-glibc-x64-${{ matrix.backend }}
          path: build
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: startsWith(matrix.version, '3.0.')
        with:
          node-version: 20.20.2
      - name: assert the JavaScript registration error on OpenSSL 3.0
        if: startsWith(matrix.version, '3.0.')
        run: node scripts/ci-check-register-node.mjs build/aws-kms.so
      - name: load and exercise the registrar
        run: |
          set -euo pipefail
          prefix="$HOME/.cache/awskms-openssl/${{ matrix.version }}"
          export PATH="$prefix/bin:$PATH"
          export LD_LIBRARY_PATH="$prefix/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          output=$(openssl version)
          got=$(sed -n 's/.*Library: OpenSSL \([0-9][0-9.]*\).*/\1/p' <<<"$output")
          got=${got:-$(awk '{print $2}' <<<"$output")}
          [ "$got" = '${{ matrix.version }}' ]
          scripts/check-symbol-floor.sh build/aws-kms.so "$prefix"
          scripts/check-load.sh build
          if [[ '${{ matrix.version }}' == 3.0.* ]]; then expected=unsupported; else expected=supported; fi
          python3 scripts/ci-check-register.py build/aws-kms.so "$prefix" "$expected"

  fips-provider-host:
    name: FIPS-enabled Node / stub retained families
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: resolve Node's exact OpenSSL release
        id: node-openssl
        run: |
          set -euo pipefail
          version=$(node -p 'process.versions.openssl.match(/^\d+\.\d+\.\d+/)?.[0] ?? ""')
          [[ $version =~ ^3\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/awskms-node-fips/${{ steps.node-openssl.outputs.version }}
          key: node-fips-${{ runner.os }}-${{ runner.arch }}-${{ steps.node-openssl.outputs.version }}
      - name: build Node's matching FIPS provider and the capable stub module
        env:
          AWSKMS_OPENSSL_FIPS: '1'
          OPENSSL_VERSION: ${{ steps.node-openssl.outputs.version }}
        run: |
          set -euo pipefail
          prefix="$HOME/.cache/awskms-node-fips/$OPENSSL_VERSION"
          scripts/build-openssl.sh "$OPENSSL_VERSION" "$prefix"
          cmake -S . -B build-fips-node -DCMAKE_BUILD_TYPE=Release \
            -DAWSKMS_BACKEND=stub -DOPENSSL_ROOT_DIR="$prefix" \
            -DCMAKE_PREFIX_PATH="$prefix"
          cmake --build build-fips-node --parallel
          ctest --test-dir build-fips-node -R '^unit$' --no-tests=error \
            --output-on-failure
          [[ $(<build-fips-node/awskms-stub-mldsa) != no ]]
      - name: activate FIPS, default, and aws-kms in Node
        id: node-fips
        env:
          OPENSSL_VERSION: ${{ steps.node-openssl.outputs.version }}
        run: |
          set -euo pipefail
          prefix="$HOME/.cache/awskms-node-fips/$OPENSSL_VERSION"
          module="$PWD/build-fips-node/aws-kms.so"
          config="$RUNNER_TEMP/node-fips-awskms.cnf"
          fips_module="$prefix/lib/ossl-modules/fips.so"
          modules="$prefix/lib/ossl-modules"
          fips_config="$RUNNER_TEMP/node-fipsmodule.cnf"
          LD_LIBRARY_PATH="$prefix/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" \
            "$prefix/bin/openssl" fipsinstall -module "$fips_module" \
              -out "$fips_config" -provider_name fips
          LD_LIBRARY_PATH="$prefix/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" \
            "$prefix/bin/openssl" fipsinstall -verify -module "$fips_module" \
              -in "$fips_config" -provider_name fips
          cat > "$config" <<EOF
          config_diagnostics = 1
          openssl_conf = node_init
          nodejs_conf = node_init
          .include $fips_config
          [node_init]
          providers = providers
          alg_section = algorithms
          [providers]
          fips = fips_sect
          default = default_sect
          aws-kms = aws_kms_sect
          [default_sect]
          activate = 1
          [aws_kms_sect]
          module = $module
          activate = 1
          [algorithms]
          default_properties = fips=yes,?keyobject.aws_kms!=yes
          EOF
          # s2n initializes these legacy hashes with a local FIPS opt-out. The
          # same fetches without that opt-out must remain globally prohibited.
          for digest in md5 md5-sha1; do
            printf test | OPENSSL_CONF="$config" OPENSSL_MODULES="$modules" \
              LD_LIBRARY_PATH="$prefix/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" \
              "$prefix/bin/openssl" dgst -propquery '-fips' "-$digest" \
                >/dev/null
            if printf test | OPENSSL_CONF="$config" OPENSSL_MODULES="$modules" \
              LD_LIBRARY_PATH="$prefix/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" \
              "$prefix/bin/openssl" dgst "-$digest" >/dev/null 2>&1; then
              echo "error: $digest escaped the global FIPS policy" >&2
              exit 1
            fi
          done
          OPENSSL_MODULES="$modules" node --openssl-config="$config" -e '
            const assert = require("node:assert/strict");
            const crypto = require("node:crypto");
            assert.equal(crypto.getFips(), 1);
            assert.throws(
              () => crypto.createPrivateKey({ key: new URL("aws-kms:") }),
              { code: "ERR_OSSL_AWSKMS_INVALID_URI" },
            );
          '
          echo "config=$config" >> "$GITHUB_OUTPUT"
          echo "modules=$modules" >> "$GITHUB_OUTPUT"
      - name: sign and verify every retained family under FIPS
        env:
          AWSKMS_CNF: ${{ steps.node-fips.outputs.config }}
          AWSKMS_MODULE: ${{ github.workspace }}/build-fips-node/aws-kms.so
          AWSKMS_TEST_FIPS: '1'
          OPENSSL_MODULES: ${{ steps.node-fips.outputs.modules }}
        run: |
          set -euo pipefail
          node test/run.mjs test/sign.test.mjs 2>&1 | tee "$RUNNER_TEMP/fips-sign.log"
          for suite in \
            'RSA_2048 signing' \
            'ECC_NIST_P256 signing' \
            'Ed25519' \
            'ML_DSA_44'; do
            grep -F "✔ $suite" "$RUNNER_TEMP/fips-sign.log"
          done

  real-kms:
    name: real AWS KMS
    if: >-
      github.event.schedule == '17 4 * * 1' ||
      (github.event_name == 'workflow_dispatch' && inputs.real_kms) || (
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.action == 'labeled' &&
        github.event.label.name == 'real-kms'
      )
    needs: build-glibc
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: awskms-real-kms
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ${{ vars.AWSKMS_TEST_REGION }}
      SUBSET: ${{ !(github.event_name == 'workflow_dispatch' && inputs.full_matrix) && '--smoke' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: resolve Node's exact OpenSSL release
        id: node-openssl
        run: |
          version=$(node -p 'process.versions.openssl.match(/^\d+\.\d+\.\d+/)?.[0] ?? ""')
          [[ $version =~ ^3\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/awskms-node-fips/${{ steps.node-openssl.outputs.version }}
          key: node-fips-${{ runner.os }}-${{ runner.arch }}-${{ steps.node-openssl.outputs.version }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: module-glibc-x64-aws
          path: build
      - run: scripts/check-load.sh build "$(command -v node)"
      - name: activate the matching FIPS provider in Node
        id: node-fips
        env:
          AWSKMS_OPENSSL_FIPS: '1'
          OPENSSL_VERSION: ${{ steps.node-openssl.outputs.version }}
        run: |
          set -euo pipefail
          prefix="$HOME/.cache/awskms-node-fips/$OPENSSL_VERSION"
          scripts/build-openssl.sh "$OPENSSL_VERSION" "$prefix"
          fips_module="$prefix/lib/ossl-modules/fips.so"
          modules="$prefix/lib/ossl-modules"
          fips_config="$RUNNER_TEMP/node-fipsmodule.cnf"
          config="$RUNNER_TEMP/node-fips-awskms.cnf"
          LD_LIBRARY_PATH="$prefix/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" \
            "$prefix/bin/openssl" fipsinstall -module "$fips_module" \
              -out "$fips_config" -provider_name fips
          cat > "$config" <<EOF
          config_diagnostics = 1
          openssl_conf = node_init
          nodejs_conf = node_init
          .include $fips_config
          [node_init]
          providers = providers
          alg_section = algorithms
          [providers]
          fips = fips_sect
          default = default_sect
          aws-kms = aws_kms_sect
          [default_sect]
          activate = 1
          [aws_kms_sect]
          module = $PWD/build/aws-kms.so
          activate = 1
          [algorithms]
          default_properties = fips=yes,?keyobject.aws_kms!=yes
          EOF
          # s2n initializes these legacy hashes with a local FIPS opt-out. The
          # same fetches without that opt-out must remain globally prohibited.
          for digest in md5 md5-sha1; do
            printf test | OPENSSL_CONF="$config" OPENSSL_MODULES="$modules" \
              LD_LIBRARY_PATH="$prefix/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" \
              "$prefix/bin/openssl" dgst -propquery '-fips' "-$digest" \
                >/dev/null
            if printf test | OPENSSL_CONF="$config" OPENSSL_MODULES="$modules" \
              LD_LIBRARY_PATH="$prefix/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" \
              "$prefix/bin/openssl" dgst "-$digest" >/dev/null 2>&1; then
              echo "error: $digest escaped the global FIPS policy" >&2
              exit 1
            fi
          done
          OPENSSL_MODULES="$modules" node --openssl-config="$config" -e '
            const assert = require("node:assert/strict");
            const crypto = require("node:crypto");
            assert.equal(crypto.getFips(), 1);
            assert.throws(
              () => crypto.createPrivateKey({ key: new URL("aws-kms:not-valid=1") }),
              { code: "ERR_OSSL_AWSKMS_INVALID_URI" },
            );
          '
          echo "config=$config" >> "$GITHUB_OUTPUT"
          echo "modules=$modules" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWSKMS_ADMIN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: create test keys
        run: node scripts/real-kms-keys.mjs setup $SUBSET
      - name: require every retained key family
        run: node scripts/ci-check-real-manifest.mjs build/real-kms-keys.json
      - name: run as the signer role
        timeout-minutes: 20
        env:
          SIGNER_ROLE_ARN: ${{ vars.AWSKMS_SIGNER_ROLE_ARN }}
          AWSKMS_CNF: ${{ steps.node-fips.outputs.config }}
          AWSKMS_TEST_FIPS: '1'
          OPENSSL_MODULES: ${{ steps.node-fips.outputs.modules }}
        run: |
          set -euo pipefail
          credentials=$(aws sts assume-role --role-arn "$SIGNER_ROLE_ARN" \
            --role-session-name "awskms-${GITHUB_RUN_ID}" --duration-seconds 3600 \
            --query Credentials --output json)
          export AWS_ACCESS_KEY_ID; AWS_ACCESS_KEY_ID=$(jq -r .AccessKeyId <<<"$credentials")
          export AWS_SECRET_ACCESS_KEY; AWS_SECRET_ACCESS_KEY=$(jq -r .SecretAccessKey <<<"$credentials")
          export AWS_SESSION_TOKEN; AWS_SESSION_TOKEN=$(jq -r .SessionToken <<<"$credentials")
          echo "::add-mask::$AWS_ACCESS_KEY_ID"
          echo "::add-mask::$AWS_SECRET_ACCESS_KEY"
          echo "::add-mask::$AWS_SESSION_TOKEN"
          probe_key=$(jq -er \
            '.keys["test-RSA_2048"].arn | select(type == "string" and length > 0)' \
            build/real-kms-keys.json)
          AWS_PAGER='' aws kms get-public-key \
            --key-id "$probe_key" \
            --region "$AWS_REGION" \
            --endpoint-url "https://kms-fips.$AWS_REGION.amazonaws.com" \
            --no-cli-pager \
            --query KeyUsage --output text | grep -Fx SIGN_VERIFY
          node --openssl-config="$AWSKMS_CNF" -e \
            'require("node:assert/strict").equal(require("node:crypto").getFips(), 1)'
          AWSKMS_AWS_LOG_ERRORS=1 AWSKMS_PROBE_KEY="$probe_key" \
            node --openssl-config="$AWSKMS_CNF" -e '
              const assert = require("node:assert/strict");
              const { createPrivateKey, getFips } = require("node:crypto");
              assert.equal(getFips(), 1);
              const key = createPrivateKey({
                key: new URL("aws-kms:key-id=" + process.env.AWSKMS_PROBE_KEY),
              });
              assert.equal(key.type, "private");
            '
          AWSKMS_TEST_REAL=1 node test/run.mjs 2>&1 | tee "$RUNNER_TEMP/real-fips.log"
          for suite in \
            'RSA_2048 signing' \
            'ECC_NIST_P256 signing' \
            'Ed25519' \
            'ML_DSA_44'; do
            grep -F "✔ $suite" "$RUNNER_TEMP/real-fips.log"
          done
      - name: schedule this run's test keys for deletion
        if: always()
        timeout-minutes: 5
        run: node scripts/real-kms-keys.mjs teardown --json

  lint:
    name: formatting and CI syntax
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: clang-format
        run: |
          python3 -m venv /tmp/cf
          /tmp/cf/bin/pip install -q clang-format==22.1.8
          /tmp/cf/bin/clang-format --dry-run --Werror \
            src/*.c src/*.h src/*.cc test/unit_*.c test/unit.h
      - name: shell and Python syntax
        run: |
          bash -n scripts/*.sh
          shellcheck -x -e SC2001,SC2016 scripts/*.sh
          scripts/ci-self-test.sh
          python3 -m py_compile scripts/ci-check-register.py
      - name: stale files, private paths, and removed curves
        run: scripts/ci-policy-gate.sh source
